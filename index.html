<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Siatka 6x6 z cyframi</title>
    <style>
        /* Tło strony */
        body {
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            height: 100vh;
            margin: 0;
            background: linear-gradient(to bottom, #555555, #1a1a1a);
            overflow: hidden;
        }

        /* Formularz logowania */
        .login-container {
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 15px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 300px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.5);
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .login-container input {
            margin: 8px 0;
            padding: 10px;
            width: 100%;
            border-radius: 5px;
            border: 1px solid #ccc;
            font-size: 14px;
        }

        .login-button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 5px;
            font-size: 18px;
            cursor: pointer;
            width: 100%;
            transition: transform 0.3s ease;
        }

        .login-button:hover {
            background-color: #45a049;
            transform: scale(1.1);
        }

        .login-button:active {
            transform: scale(0.95);
        }

        .error-message {
            color: red;
            font-size: 14px;
            margin-top: 10px;
        }

        /* Siatka */
        .restart-button {
            background: linear-gradient(to bottom, #5d9c66, #306b39);
            border: 2px solid #000;
            padding: 12px 24px;
            font-size: 20px;
            cursor: pointer;
            color: white;
            border-radius: 8px;
            box-shadow: 0px 4px 8px rgba(0,0,0,0.4);
            font-weight: bold;
            margin-bottom: 20px;
            transition: transform 0.3s ease, box-shadow 0.3s ease, background 0.3s ease;
            text-align: center;
            display: none;  /* Na początku ukryty */
        }

        .restart-button:hover {
            transform: scale(1.1);
            box-shadow: 0px 4px 16px rgba(0,0,0,0.7);
            background: linear-gradient(to bottom, #6ab67e, #4c7e46);
        }

        .restart-button:active {
            transform: scale(0.95);
            box-shadow: 0px 4px 8px rgba(0,0,0,0.5);
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(6, 100px);
            grid-template-rows: repeat(6, 100px);
            gap: 10px;
            display: none;  /* Na początku ukryta */
        }

        .grid-item {
            width: 100px;
            height: 100px;
            background-color: #555555;
            border: 2px solid #4dff91;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            color: #4dff91;
            cursor: pointer;
            box-shadow: 0px 4px 8px rgba(0,0,0,0.5);
            text-align: center;
        }

        .grid-item:hover { background-color: #3d3d3d; }

        /* Animacje */
        @keyframes appear {
            0% {opacity:0; transform: scale(0);}
            100% {opacity:1; transform: scale(1);}
        }

        @keyframes disappear {
            0% {opacity:1; transform: scale(1);}
            100% {opacity:0; transform: scale(0);}
        }

        .appear { animation: appear 0.4s forwards; }
        .disappear { animation: disappear 0.4s forwards; }

        /* Animacja spadającego śniegu */
        .snowflake {
            position: absolute;
            top: -10px;
            font-size: 24px;
            color: white;
            user-select: none;
            pointer-events: none;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% {
                transform: translateY(0);
            }
            100% {
                transform: translateY(100vh);
            }
        }
    </style>
</head>
<body>

    <!-- Formularz logowania -->
    <div id="login-container" class="login-container">
        <h2>Logowanie</h2>
        <form id="login-form">
            <input type="text" id="username" placeholder="Nazwa użytkownika" required>
            <input type="password" id="password" placeholder="Hasło" required>
            <button type="submit" class="login-button">Zaloguj się</button>
        </form>
        <p id="login-error" class="error-message" style="display:none;">Błędna nazwa użytkownika lub hasło</p>
    </div>

    <!-- Siatka -->
    <button id="restart-button" class="restart-button" onclick="restartGrid()">Restart</button>
    <div class="grid-container" id="grid-container"></div>

    <!-- Generowanie śniegu -->
    <script>
        // Funkcja generująca spadający śnieg
        function createSnowflakes() {
            for (let i = 0; i < 50; i++) {
                let snowflake = document.createElement("div");
                snowflake.classList.add("snowflake");
                snowflake.textContent = "❄";
                snowflake.style.left = Math.random() * 100 + "vw";  // Losowa pozycja w poziomie
                snowflake.style.animationDuration = Math.random() * 3 + 2 + "s";  // Losowy czas opadania
                snowflake.style.animationDelay = Math.random() * 5 + "s";  // Losowe opóźnienie
                document.body.appendChild(snowflake);
            }
        }
        createSnowflakes(); // Uruchomienie generowania śniegu

        // Przechowywanie danych logowania
        const storedUsername = "123";
        const storedPassword = "123";

        // Funkcja logowania
        document.getElementById("login-form").addEventListener("submit", function(e) {
            e.preventDefault(); // Zapobiega przeładowaniu strony

            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;

            if (username === storedUsername && password === storedPassword) {
                // Jeśli dane są poprawne
                sessionStorage.setItem("loggedIn", true);  // Zapisz stan logowania
                document.getElementById("login-container").style.display = "none";  // Ukryj formularz logowania
                document.getElementById("restart-button").style.display = "block"; // Pokaż przycisk Restart
                document.getElementById("grid-container").style.display = "grid";  // Pokaż siatkę
                showGrid(); // Uruchom funkcję wyświetlania siatki
            } else {
                // Błędne dane logowania
                document.getElementById("login-error").style.display = "block";
            }
        });

        // Funkcja do pokazania siatki
        function showGrid() {
            const gridContainer = document.getElementById("grid-container");
            let currentNumber = 1;
            let lastDeletedNumber = null;
            const cellValues = new Array(36).fill(null).map(() => []);
