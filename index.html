<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Siatka 6x6 z cyframi</title>
    <style>
        /* Tło strony */
        body {
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            height: 100vh;
            background: linear-gradient(to bottom, #555555, #1a1a1a);
            margin: 0;
        }

        /* Formularz logowania */
        .login-container {
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 20px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 300px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.5);
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .login-container input {
            margin: 10px;
            padding: 10px;
            width: 100%;
            border-radius: 5px;
            border: 1px solid #ccc;
            font-size: 16px;
        }

        .login-button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 5px;
            font-size: 18px;
            cursor: pointer;
            width: 100%;
        }

        .login-button:hover {
            background-color: #45a049;
        }

        .error-message {
            color: red;
            font-size: 14px;
            margin-top: 10px;
        }

        /* Siatka */
        .restart-button {
            background: linear-gradient(to bottom, #5d9c66, #306b39);
            border: 2px solid #000;
            padding: 12px 24px;
            font-size: 20px;
            cursor: pointer;
            color: white;
            border-radius: 8px;
            box-shadow: 0px 4px 8px rgba(0,0,0,0.4);
            font-weight: bold;
            margin-bottom: 20px;
            transition: transform 0.3s ease, box-shadow 0.3s ease, background 0.3s ease;
            text-align: center;
            display: none;
        }

        .restart-button:hover {
            transform: scale(1.1);
            box-shadow: 0px 4px 16px rgba(0,0,0,0.7);
            background: linear-gradient(to bottom, #6ab67e, #4c7e46);
        }

        .restart-button:active {
            transform: scale(0.95);
            box-shadow: 0px 4px 8px rgba(0,0,0,0.5);
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(6, 100px);
            grid-template-rows: repeat(6, 100px);
            gap: 10px;
            display: none;
        }

        .grid-item {
            width: 100px;
            height: 100px;
            background-color: #555555;
            border: 2px solid #4dff91;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            color: #4dff91;
            cursor: pointer;
            box-shadow: 0px 4px 8px rgba(0,0,0,0.5);
            text-align: center;
        }

        .grid-item:hover { background-color: #3d3d3d; }

        .number, .separator {
            opacity: 0;
            transform: scale(0);
            display: inline-block;
        }

        .number {
            padding: 0 3px;
            border-radius: 6px;
            text-shadow: -1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,1px 1px 0 #000;
        }

        .separator {
            padding: 0 5px;
            font-size: 30px;
            border-radius: 12px;
            text-shadow: -1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,1px 1px 0 #000;
            color: white;
            vertical-align: middle;
        }

        @keyframes appear {
            0% {opacity:0; transform: scale(0);}
            100% {opacity:1; transform: scale(1);}
        }

        @keyframes disappear {
            0% {opacity:1; transform: scale(1);}
            100% {opacity:0; transform: scale(0);}
        }

        .appear { animation: appear 0.4s forwards; }
        .disappear { animation: disappear 0.4s forwards; }
    </style>
</head>
<body>

    <!-- Formularz logowania -->
    <div id="login-container" class="login-container">
        <h2>Logowanie</h2>
        <form id="login-form">
            <input type="text" id="username" placeholder="Nazwa użytkownika" required>
            <input type="password" id="password" placeholder="Hasło" required>
            <button type="submit" class="login-button">Zaloguj się</button>
        </form>
        <p id="login-error" class="error-message" style="display:none;">Błędna nazwa użytkownika lub hasło</p>
    </div>

    <!-- Siatka -->
    <button id="restart-button" class="restart-button" onclick="restartGrid()">Restart</button>
    <div class="grid-container" id="grid-container"></div>

            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;

            if (username === storedUsername && password === storedPassword) {
                // Jeśli dane są poprawne
                sessionStorage.setItem("loggedIn", true);  // Zapisz stan logowania
                document.getElementById("login-container").style.display = "none";  // Ukryj formularz logowania
                document.getElementById("restart-button").style.display = "block"; // Pokaż przycisk Restart
                showGrid();  // Pokaż siatkę
            } else {
                // Błędne dane logowania
                document.getElementById("login-error").style.display = "block";
            }
        });

        if (sessionStorage.getItem("loggedIn") === "true") {

            document.getElementById("restart-button").style.display = "block";  // Pokaż przycisk Restart
            showGrid();  // Pokaż siatkę
        }
